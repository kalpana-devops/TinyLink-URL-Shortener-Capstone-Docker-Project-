services:
nginx:
image: nginx:1.25-alpine
ports:
- "8080:80" # the ONLY port exposed to the host
volumes:
- ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro # bind mount (not a named volume)
depends_on:
- php-frontend
- java-backend
networks:
- tinylink-net
php-frontend:
build:
context: ./php-frontend
dockerfile: Dockerfile
environment:
API_BASE_URL: http://java-backend:8080
LOG_DIR: /var/log/tinylink
volumes:
- shared-logs:/var/log/tinylink # NFS-backed volume, ALSO mounted by java-backend
depends_on:
- java-backend
networks:
- tinylink-net
# NOTE: deliberately no "ports:" — only nginx and other containers on
# tinylink-net can reach this service.
java-backend:
build:
context: ./java-backend
dockerfile: Dockerfile
environment:
REDIS_HOST: redis
REDIS_PORT: 6379
APP_PORT: 8080
LOG_DIR: /var/log/tinylink
volumes:
- shared-logs:/var/log/tinylink # same NFS export as php-frontend — proves it's
shared
depends_on:
- redis
networks:
- tinylink-net
# NOTE: deliberately no "ports:" — same reasoning as php-frontend.
redis:
image: redis:7-alpine
volumes:
- redis-data:/data # NFS-backed named volume -> persistence
command: ["redis-server", "--appendonly", "yes"]
depends_on:
nfs-server:
condition: service_healthy
networks:
- tinylink-net
