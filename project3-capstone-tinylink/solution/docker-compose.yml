services:
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "8080:80" # the ONLY port exposed to the host
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro # bind mount (not a named volume)
    depends_on:
      - php-frontend
      - java-backend
    networks:
      - tinylink-net

  php-frontend:
    build:
      context: ./php-frontend
      dockerfile: Dockerfile
    environment:
      API_BASE_URL: http://java-backend:8080
      LOG_DIR: /var/log/tinylink
    volumes:
      - shared-logs:/var/log/tinylink # NFS-backed volume, ALSO mounted by java-backend
    depends_on:
      - java-backend
    networks:
      - tinylink-net

  java-backend:
    build:
      context: ./java-backend
      dockerfile: Dockerfile
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      APP_PORT: 8080
      LOG_DIR: /var/log/tinylink
    volumes:
      - shared-logs:/var/log/tinylink # same NFS export as php-frontend — proves it's shared
    depends_on:
      - redis
    networks:
      - tinylink-net

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data # NFS-backed named volume -> persistence
    command: ["redis-server", "--appendonly", "yes"]
    depends_on:
      nfs-server:
        condition: service_healthy
    networks:
      - tinylink-net

  nfs-server:
    image: itsthenetwork/nfs-server-alpine:latest
    privileged: true
    environment:
      SHARED_DIRECTORY: /data
    volumes:
      - nfs-storage:/data
    depends_on:
      nfs-init:
        condition: service_completed_successfully
    networks:
      tinylink-net:
        ipv4_address: 172.30.0.10
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 2049 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12

  nfs-init:
    image: alpine:3.19
    command: ["sh", "-c", "mkdir -p /data/redis /data/logs && chmod -R 777 /data"]
    volumes:
      - nfs-storage:/data

volumes:
  nfs-storage: # plain local volume — the NFS server's own backing disk
  redis-data:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=172.30.0.10,rw,nfsvers=4,nolock,soft"
      device: ":/redis"
  shared-logs:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=172.30.0.10,rw,nfsvers=4,nolock,soft"
      device: ":/logs"

networks:
  tinylink-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
