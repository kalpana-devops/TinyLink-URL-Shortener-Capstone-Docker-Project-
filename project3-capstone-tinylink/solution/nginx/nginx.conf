events {}
http {
server {
listen 80;
# Route API calls to the Java backend.
# Trailing slashes on both sides matter: they strip "/api/" before
# forwarding, so Java sees /shorten, /resolve, etc. at its own root
# OR keep them symmetric (as below) so Java sees /api/... unchanged.
location /api/ {
proxy_pass http://java-backend:8080/api/;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
# Everything else goes to the PHP frontend.
location / {
proxy_pass http://php-frontend:80/;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
}
}
